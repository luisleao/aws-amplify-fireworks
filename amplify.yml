version: 1
frontend:
  phases:
    preBuild:
      commands:
        # O Next 16 exige Node >= 20.19; o Amplify ainda pode cair numa imagem
        # mais antiga dependendo da configuração do app.
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
