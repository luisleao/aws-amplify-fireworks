version: 1
frontend:
  phases:
    preBuild:
      commands:
        # O Next 16 exige Node >= 20.19; o Amplify ainda pode cair numa imagem
        # mais antiga dependendo da configuração do app.
        - nvm use 22 || nvm install 22
        - npm ci
    build:
      commands:
        # O Amplify expõe as variáveis do app no build, mas não no runtime do
        # compute SSR. Gravar .env.production faz o servidor do Next carregá-las
        # quando a função sobe.
        - env | grep -E '^(EVENTS_|NEXT_PUBLIC_EVENTS_)' >> .env.production || true
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
